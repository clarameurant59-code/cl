<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌿 VERT RESTO - Visite Virtuelle 3D Immersive</title>
    <style>
:root {
    --color-primary: #2c5f2d;
    --color-accent: #a8c686;
    --color-wood-light: #d4a574;
    --color-wood-dark: #8b6f47;
    --color-sage: #9ba982;
    --color-beige: #f5f1e8;
    --color-cream: #e8f0e8;
    --color-black: #2a2a2a;
    --color-white: #ffffff;
    --shadow-light: rgba(0, 0, 0, 0.1);
    --shadow-medium: rgba(0, 0, 0, 0.2);
    --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: #1a1a1a;
}

#renderCanvas {
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
}

.ui-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 100;
}

.header-section {
    position: fixed;
    top: 20px;
    left: 20px;
    pointer-events: auto;
    z-index: 110;
}

.logo-container {
    display: flex;
    align-items: center;
    gap: 15px;
    background: rgba(255, 255, 255, 0.95);
    padding: 16px 20px;
    border-radius: 12px;
    box-shadow: 0 10px 40px var(--shadow-medium);
    backdrop-filter: blur(20px);
}

.logo-icon {
    font-size: 32px;
    animation: float 3s ease-in-out infinite;
}

.logo-text h1 {
    font-size: 20px;
    font-weight: 700;
    color: var(--color-primary);
    margin: 0;
    letter-spacing: 1px;
}

.logo-text p {
    font-size: 11px;
    color: #888;
    margin: 4px 0 0 0;
    letter-spacing: 0.5px;
}

.info-panel {
    position: fixed;
    top: 140px;
    left: 20px;
    width: 340px;
    max-height: 320px;
    background: rgba(255, 255, 255, 0.97);
    padding: 22px;
    border-radius: 14px;
    box-shadow: 0 10px 40px var(--shadow-medium);
    pointer-events: auto;
    overflow-y: auto;
    border-left: 4px solid var(--color-accent);
    backdrop-filter: blur(20px);
    animation: slideInLeft 0.5s ease;
}

.info-content h2 {
    font-size: 18px;
    color: var(--color-primary);
    margin-bottom: 6px;
    font-weight: 600;
}

.info-content > p {
    font-size: 12px;
    color: #999;
    margin-bottom: 14px;
}

.info-panel hr {
    border: none;
    border-top: 1px solid #e0e0e0;
    margin: 14px 0;
}

.zone-info {
    margin-top: 14px;
}

.zone-info h3 {
    font-size: 15px;
    color: var(--color-primary);
    margin-bottom: 8px;
    font-weight: 600;
}

.zone-info p {
    font-size: 12px;
    color: #666;
    line-height: 1.6;
    background: #f9f7f3;
    padding: 12px;
    border-radius: 8px;
    border-left: 3px solid var(--color-wood-light);
}

.nav-menu {
    position: fixed;
    top: 480px;
    left: 20px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    pointer-events: auto;
    animation: slideInLeft 0.6s ease 0.1s both;
}

.nav-btn {
    padding: 11px 16px;
    background: rgba(44, 95, 45, 0.88);
    color: white;
    border: 2px solid transparent;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
    transition: var(--transition);
    backdrop-filter: blur(20px);
    white-space: nowrap;
}

.nav-btn:hover {
    background: rgba(44, 95, 45, 1);
    transform: translateX(8px);
    box-shadow: 0 6px 20px rgba(44, 95, 45, 0.3);
}

.nav-btn.active {
    background: var(--color-accent);
    color: var(--color-primary);
    font-weight: 600;
    border-color: var(--color-primary);
    box-shadow: 0 6px 20px rgba(168, 198, 134, 0.4);
}

.controls {
    position: fixed;
    bottom: 30px;
    right: 30px;
    display: flex;
    gap: 10px;
    pointer-events: auto;
    flex-direction: column;
    animation: slideInRight 0.5s ease;
}

.control-btn {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    background: rgba(44, 95, 45, 0.9);
    border: none;
    color: white;
    font-size: 18px;
    cursor: pointer;
    transition: var(--transition);
    box-shadow: 0 4px 14px var(--shadow-light);
    display: flex;
    align-items: center;
    justify-content: center;
}

.control-btn:hover {
    background: rgba(44, 95, 45, 1);
    transform: scale(1.12);
    box-shadow: 0 6px 20px rgba(44, 95, 45, 0.4);
}

.control-btn:active {
    transform: scale(0.95);
}

.help-text {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(44, 95, 45, 0.92);
    color: white;
    padding: 12px 20px;
    border-radius: 25px;
    font-size: 12px;
    pointer-events: auto;
    backdrop-filter: blur(20px);
    animation: slideUp 0.5s ease 0.2s both;
    white-space: nowrap;
}

.loading-container {
    position: fixed;
    bottom: 100px;
    right: 30px;
    width: 200px;
    pointer-events: auto;
    animation: slideInRight 0.5s ease;
    opacity: 1;
    transition: opacity 0.5s ease;
}

.loading-container.hidden {
    opacity: 0;
    pointer-events: none;
}

.loading-bar {
    width: 100%;
    height: 4px;
    background: rgba(255, 255, 255, 0.2);
    border-radius: 2px;
    overflow: hidden;
    margin-bottom: 8px;
}

.loading-progress {
    height: 100%;
    background: linear-gradient(90deg, var(--color-accent), var(--color-primary));
    width: 0%;
    transition: width 0.3s ease;
    border-radius: 2px;
}

#loading-text {
    font-size: 11px;
    color: rgba(255, 255, 255, 0.7);
    text-align: right;
}

@keyframes float {
    0%, 100% { transform: translateY(0px); }
    50% { transform: translateY(-8px); }
}

@keyframes slideInLeft {
    from {
        opacity: 0;
        transform: translateX(-20px);
    }
    to {
        opacity: 1;
        transform: translateX(0);
    }
}

@keyframes slideInRight {
    from {
        opacity: 0;
        transform: translateX(20px);
    }
    to {
        opacity: 1;
        transform: translateX(0);
    }
}

@keyframes slideUp {
    from {
        opacity: 0;
        transform: translateX(-50%) translateY(20px);
    }
    to {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
    }
}

@media (max-width: 768px) {
    .logo-container { padding: 12px 14px; }
    .logo-icon { font-size: 24px; }
    .logo-text h1 { font-size: 16px; }
    .info-panel { width: 280px; top: 100px; padding: 16px; max-height: 280px; }
    .nav-menu { top: 420px; left: 10px; flex-direction: row; flex-wrap: wrap; gap: 6px; }
    .nav-btn { padding: 8px 12px; font-size: 11px; }
    .controls { bottom: 20px; right: 20px; flex-direction: row; gap: 8px; }
    .control-btn { width: 44px; height: 44px; font-size: 16px; }
    .help-text { font-size: 10px; bottom: 20px; padding: 10px 16px; white-space: normal; max-width: 200px; }
}
    </style>
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/materialsLibrary/babylonjs.materials.min.js"></script>
</head>
<body>
    <canvas id="renderCanvas"></canvas>
    
    <div class="ui-overlay">
        <div class="header-section">
            <div class="logo-container">
                <div class="logo-icon">🌿</div>
                <div class="logo-text">
                    <h1>VERT RESTO</h1>
                    <p>Restaurant Éco-Responsable</p>
                </div>
            </div>
        </div>
        
        <div class="info-panel">
            <div class="info-content">
                <h2 id="location-name">Centre-Ville Nantes</h2>
                <p id="location-desc">60 couverts • Éco-Responsable • Moderne</p>
                <hr>
                <div id="zone-info" class="zone-info">
                    <h3 id="zone-title">Bienvenue</h3>
                    <p id="zone-description">Explorez votre futur restaurant</p>
                </div>
            </div>
        </div>
        
        <div class="nav-menu">
            <button class="nav-btn active" data-camera="entrance">🔔 Entrée</button>
            <button class="nav-btn" data-camera="dining">🍽️ Salle</button>
            <button class="nav-btn" data-camera="bar">🍷 Bar</button>
            <button class="nav-btn" data-camera="kitchen">👨‍🍳 Cuisine</button>
            <button class="nav-btn" data-camera="overview">🏢 Vue Globale</button>
        </div>
        
        <div class="controls">
            <button id="btn-info" class="control-btn" title="Info">ℹ️</button>
            <button id="btn-fullscreen" class="control-btn" title="Fullscreen">⛶</button>
            <button id="btn-360" class="control-btn" title="360°">🔄</button>
            <button id="btn-reset" class="control-btn" title="Reset">🔁</button>
        </div>
        
        <div class="help-text">
            🖱️ Drag to navigate | 🔍 Scroll to zoom | Mobile: Swipe
        </div>
        
        <div class="loading-container">
            <div class="loading-bar">
                <div id="loading-progress" class="loading-progress"></div>
            </div>
            <p id="loading-text">Création du restaurant...</p>
        </div>
    </div>

    <script>
const SCENE_WIDTH = 10;
const SCENE_HEIGHT = 3.2;
const SCENE_DEPTH = 6;

let engine, scene, camera, shadowGenerator;
let materialLibrary = {};
let isRotating = false;

function initBabylonEngine() {
    const canvas = document.getElementById('renderCanvas');
    engine = new BABYLON.Engine(canvas, true, {
        preserveDrawingBuffer: true,
        antialias: true,
        powerPreference: 'high-performance'
    });
    
    scene = new BABYLON.Scene(engine);
    scene.clearColor = new BABYLON.Color3.FromHexString('#e8f0e8');
    scene.collisionsEnabled = true;
    
    window.addEventListener('resize', () => engine.resize());
    return { engine, scene };
}

function createCamera() {
    camera = new BABYLON.UniversalCamera('mainCamera', new BABYLON.Vector3(0, 1.7, 8));
    camera.attachControl(document.getElementById('renderCanvas'), true);
    camera.inertia = 0.7;
    camera.angularSensibility = 1000;
    camera.keysUp = [];
    camera.keysDown = [];
    camera.keysLeft = [];
    camera.keysRight = [];
    camera.minZ = 0.1;
    camera.maxZ = 1000;
}

function createMaterials() {
    materialLibrary.wall = new BABYLON.StandardMaterial('wall', scene);
    materialLibrary.wall.diffuse = new BABYLON.Color3.FromHexString('#f5f1e8');
    materialLibrary.wall.specularColor = new BABYLON.Color3(0.15, 0.15, 0.15);
    
    materialLibrary.floor = new BABYLON.StandardMaterial('floor', scene);
    materialLibrary.floor.diffuse = new BABYLON.Color3.FromHexString('#e8dcc8');
    materialLibrary.floor.specularColor = new BABYLON.Color3(0.2, 0.2, 0.2);
    
    materialLibrary.woodLight = new BABYLON.StandardMaterial('woodLight', scene);
    materialLibrary.woodLight.diffuse = new BABYLON.Color3.FromHexString('#d4a574');
    materialLibrary.woodLight.specularColor = new BABYLON.Color3(0.3, 0.3, 0.3);
    materialLibrary.woodLight.specularPower = 32;
    
    materialLibrary.woodDark = new BABYLON.StandardMaterial('woodDark', scene);
    materialLibrary.woodDark.diffuse = new BABYLON.Color3.FromHexString('#8b6f47');
    materialLibrary.woodDark.specularColor = new BABYLON.Color3(0.25, 0.25, 0.25);
    
    materialLibrary.sageGreen = new BABYLON.StandardMaterial('sageGreen', scene);
    materialLibrary.sageGreen.diffuse = new BABYLON.Color3.FromHexString('#9ba982');
    
    materialLibrary.accentGreen = new BABYLON.StandardMaterial('accentGreen', scene);
    materialLibrary.accentGreen.diffuse = new BABYLON.Color3.FromHexString('#a8c686');
    
    materialLibrary.blackMatte = new BABYLON.StandardMaterial('blackMatte', scene);
    materialLibrary.blackMatte.diffuse = new BABYLON.Color3.FromHexString('#2a2a2a');
    materialLibrary.blackMatte.specularColor = new BABYLON.Color3(0.05, 0.05, 0.05);
    
    materialLibrary.ceramic = new BABYLON.StandardMaterial('ceramic', scene);
    materialLibrary.ceramic.diffuse = new BABYLON.Color3.FromHexString('#b5a69c');
    materialLibrary.ceramic.specularColor = new BABYLON.Color3(0.3, 0.3, 0.3);
    materialLibrary.ceramic.specularPower = 32;
    
    materialLibrary.plant = new BABYLON.StandardMaterial('plant', scene);
    materialLibrary.plant.diffuse = new BABYLON.Color3(0.4, 0.5, 0.35);
    materialLibrary.plant.specularColor = new BABYLON.Color3(0.05, 0.05, 0.05);
}

function buildRestaurantScene() {
    // Floor
    const floor = BABYLON.MeshBuilder.CreateGround('floor', { width: SCENE_WIDTH, height: SCENE_DEPTH }, scene);
    floor.material = materialLibrary.floor;
    floor.checkCollisions = true;
    
    // Walls
    const wallThickness = 0.15;
    
    const backWall = BABYLON.MeshBuilder.CreateBox('backWall', {
        width: SCENE_WIDTH, height: SCENE_HEIGHT, depth: wallThickness
    }, scene);
    backWall.position.z = -SCENE_DEPTH / 2;
    backWall.material = materialLibrary.wall;
    
    const leftWall = BABYLON.MeshBuilder.CreateBox('leftWall', {
        width: wallThickness, height: SCENE_HEIGHT, depth: SCENE_DEPTH
    }, scene);
    leftWall.position.x = -SCENE_WIDTH / 2;
    leftWall.material = materialLibrary.wall;
    
    const rightWall = BABYLON.MeshBuilder.CreateBox('rightWall', {
        width: wallThickness, height: SCENE_HEIGHT, depth: SCENE_DEPTH
    }, scene);
    rightWall.position.x = SCENE_WIDTH / 2;
    rightWall.material = materialLibrary.wall;
    
    const ceiling = BABYLON.MeshBuilder.CreateBox('ceiling', {
        width: SCENE_WIDTH, height: 0.2, depth: SCENE_DEPTH
    }, scene);
    ceiling.position.y = SCENE_HEIGHT - 0.1;
    ceiling.material = materialLibrary.wall;
    
    // Entrance
    const counterBody = BABYLON.MeshBuilder.CreateBox('counterBody', {
        width: 2.8, height: 1.1, depth: 0.9
    }, scene);
    counterBody.position.set(0, 0.55, 4.8);
    counterBody.material = materialLibrary.woodLight;
    counterBody.castShadow = true;
    
    const counterTop = BABYLON.MeshBuilder.CreateBox('counterTop', {
        width: 2.8, height: 0.12, depth: 0.9
    }, scene);
    counterTop.position.set(0, 1.16, 4.8);
    counterTop.material = materialLibrary.blackMatte;
    
    // Tables - 12 tables x 5 covers = 60
    const tablePositions = [
        [-3.5, 0, 0.5], [-3.5, 0, 2.5], [-3.5, 0, 4],
        [-1.5, 0, 0.5], [-1.5, 0, 2.5], [-1.5, 0, 4],
        [1.5, 0, 0.5], [1.5, 0, 2.5], [1.5, 0, 4],
        [3.5, 0, 0.5], [3.5, 0, 2.5], [3.5, 0, 4]
    ];
    
    tablePositions.forEach((pos, idx) => {
        const tableTop = BABYLON.MeshBuilder.CreateCylinder(`table_${idx}`, 
            { diameter: 1.2, height: 0.08, tessellation: 32 }, scene);
        tableTop.position = new BABYLON.Vector3(pos[0], pos[1] + 0.76, pos[2]);
        tableTop.material = materialLibrary.woodLight;
        tableTop.castShadow = true;
        
        const tableBase = BABYLON.MeshBuilder.CreateCylinder(`base_${idx}`, 
            { diameter: 0.12, height: 0.68, tessellation: 16 }, scene);
        tableBase.position = new BABYLON.Vector3(pos[0], pos[1] + 0.34, pos[2]);
        tableBase.material = materialLibrary.woodDark;
        tableBase.castShadow = true;
    });
    
    // Bar
    const bar = BABYLON.MeshBuilder.CreateBox('bar', {
        width: 3.5, height: 1.15, depth: 0.7
    }, scene);
    bar.position.set(0, 0.58, -3.5);
    bar.material = materialLibrary.sageGreen;
    bar.castShadow = true;
    
    // Plants
    const plantPositions = [[-4.3, 0, -2.5], [4.3, 0, -2.5], [-4.3, 0, 3], [4.3, 0, 3]];
    plantPositions.forEach((pos, i) => {
        const pot = BABYLON.MeshBuilder.CreateCylinder(`pot_${i}`, 
            { diameter: 0.55, height: 0.45, tessellation: 16 }, scene);
        pot.position = new BABYLON.Vector3(pos[0], pos[1] + 0.23, pos[2]);
        pot.material = materialLibrary.ceramic;
        pot.castShadow = true;
        
        const foliage = BABYLON.MeshBuilder.CreateSphere(`foliage_${i}`, 
            { diameter: 0.8, segments: 16 }, scene);
        foliage.position = new BABYLON.Vector3(pos[0], pos[1] + 0.9, pos[2]);
        foliage.material = materialLibrary.plant;
        foliage.castShadow = true;
    });
}

function setupLighting() {
    const ambientLight = new BABYLON.HemisphericLight('ambientLight', 
        new BABYLON.Vector3(0.3, 1, 0.5), scene);
    ambientLight.intensity = 0.5;
    
    const sunLight = new BABYLON.PointLight('sunLight', 
        new BABYLON.Vector3(2, 3, 3), scene);
    sunLight.intensity = 0.85;
    sunLight.range = 150;
    
    shadowGenerator = new BABYLON.ShadowGenerator(1024, sunLight);
    shadowGenerator.useBlurExponentialShadowMap = true;
    shadowGenerator.blurKernel = 32;
    
    // Pendant lights
    const tablePositions = [
        [-3.5, 2.6, 0.5], [-3.5, 2.6, 2.5], [-3.5, 2.6, 4],
        [-1.5, 2.6, 0.5], [-1.5, 2.6, 2.5], [-1.5, 2.6, 4],
        [1.5, 2.6, 0.5], [1.5, 2.6, 2.5], [1.5, 2.6, 4],
        [3.5, 2.6, 0.5], [3.5, 2.6, 2.5], [3.5, 2.6, 4]
    ];
    
    tablePositions.forEach((pos, i) => {
        const light = new BABYLON.PointLight(`pendant_${i}`, 
            new BABYLON.Vector3(pos[0], pos[1], pos[2]), scene);
        light.intensity = 0.65;
        light.range = 9;
        light.diffuse = new BABYLON.Color3(1, 0.95, 0.85);
    });
}

const CAMERA_POSITIONS = {
    entrance: { pos: new BABYLON.Vector3(0, 1.8, 6), target: new BABYLON.Vector3(0, 1.6, 2) },
    dining: { pos: new BABYLON.Vector3(0, 1.8, 3), target: new BABYLON.Vector3(0, 0.8, 0) },
    bar: { pos: new BABYLON.Vector3(-2, 1.8, -2), target: new BABYLON.Vector3(0, 0.8, -3.5) },
    kitchen: { pos: new BABYLON.Vector3(1, 1.8, -4), target: new BABYLON.Vector3(0, 0.8, -5) },
    overview: { pos: new BABYLON.Vector3(6, 2.8, 0), target: new BABYLON.Vector3(0, 1.2, 0) }
};

function setCamera(camName) {
    const camData = CAMERA_POSITIONS[camName];
    if (!camData) return;
    
    const startPos = camera.position.clone();
    const startTarget = camera.target.clone();
    const duration = 1.2;
    const startTime = Date.now();
    
    const animate = () => {
        const elapsed = (Date.now() - startTime) / 1000;
        const t = Math.min(elapsed / duration, 1);
        const easeT = t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;
        
        camera.position = BABYLON.Vector3.Lerp(startPos, camData.pos, easeT);
        camera.setTarget(BABYLON.Vector3.Lerp(startTarget, camData.target, easeT));
        
        if (t < 1) requestAnimationFrame(animate);
    };
    animate();
}

const ZONE_INFO = {
    entrance: { title: '🔔 Accueil', desc: 'Comptoir compact', details: 'Première impression premium en bois PEFC.' },
    dining: { title: '🍽️ Salle', desc: '60 couverts optimisés', details: 'Tables rondes en bois avec chaises ergonomiques.' },
    bar: { title: '🍷 Bar', desc: 'Zone service', details: 'Comptoir en vert sauge avec accents de bois.' },
    kitchen: { title: '👨‍🍳 Cuisine', desc: 'Espace préparation', details: 'Zone optimisée pour la préparation des plats.' },
    overview: { title: '🏢 Vue Globale', desc: 'Perspective ensemble', details: 'Restaurant 10m x 6m avec 60 couverts optimisés.' }
};

function updateZoneInfo(zone) {
    const info = ZONE_INFO[zone];
    if (info) {
        document.getElementById('zone-title').textContent = info.title;
        document.getElementById('zone-description').textContent = info.details;
    }
}

function setupInteractions() {
    document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
            const cam = e.target.dataset.camera;
            setCamera(cam);
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            e.target.classList.add('active');
            updateZoneInfo(cam);
        });
    });
    
    document.getElementById('btn-fullscreen').addEventListener('click', () => {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(e => console.log(e));
        } else {
            document.exitFullscreen();
        }
    });
    
    document.getElementById('btn-reset').addEventListener('click', () => {
        location.reload();
    });
}

function startRenderLoop() {
    engine.runRenderLoop(() => {
        scene.render();
    });
}

function updateProgress(pct) {
    document.getElementById('loading-progress').style.width = pct + '%';
}

function hideLoading() {
    const container = document.querySelector('.loading-container');
    setTimeout(() => container.classList.add('hidden'), 500);
}

window.addEventListener('DOMContentLoaded', () => {
    console.log('🌿 Initializing Vert Resto...');
    
    initBabylonEngine();
    updateProgress(10);
    
    createCamera();
    updateProgress(20);
    
    createMaterials();
    updateProgress(40);
    
    buildRestaurantScene();
    updateProgress(60);
    
    setupLighting();
    updateProgress(80);
    
    setupInteractions();
    updateProgress(100);
    
    startRenderLoop();
    hideLoading();
    updateZoneInfo('entrance');
    
    console.log('✓ Vert Resto Ready!');
});
    </script>
</body>
</html>
