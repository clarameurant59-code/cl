<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vert Resto - Visite Virtuelle 3D | Restaurant Éco-Responsable Nantes</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/materialsLibrary/babylonjs.materials.min.js"></script>
    <script src="https://cdn.babylonjs.com/postProcessesLibrary/babylonjs.postProcess.min.js"></script>
</head>
<body>
    <canvas id="renderCanvas"></canvas>
    
    <!-- UI Container -->
    <div class="ui-container">
        <!-- Header -->
        <div class="header">
            <div class="logo">🌿 VERT RESTO</div>
            <div class="subtitle">Restaurant Éco-Responsable - Nantes</div>
        </div>
        
        <!-- Info Panel -->
        <div class="info-panel">
            <h2 id="zone-title">Bienvenue</h2>
            <p id="zone-description">Explorez notre restaurant éco-responsable de 60 couverts</p>
            <div id="zone-details" class="zone-details"></div>
        </div>
        
        <!-- Navigation Zones -->
        <div class="nav-zones">
            <button class="zone-btn active" data-zone="accueil">🔔 Accueil</button>
            <button class="zone-btn" data-zone="dining">🍽️ Salle</button>
            <button class="zone-btn" data-zone="kitchen">👨‍🍳 Cuisine</button>
            <button class="zone-btn" data-zone="bar">🍷 Bar</button>
            <button class="zone-btn" data-zone="terrasse">🌿 Terrasse</button>
        </div>
        
        <!-- Controls -->
        <div class="controls">
            <button id="btn-fullscreen" class="ctrl-btn" title="Plein écran">⛶</button>
            <button id="btn-reset" class="ctrl-btn" title="Réinitialiser">🔄</button>
            <button id="btn-settings" class="ctrl-btn" title="Paramètres">⚙️</button>
        </div>
        
        <!-- Help -->
        <div class="help-overlay">
            <p>🖱️ Drag to navigate | 🔍 Scroll to zoom | Mobile: Swipe</p>
        </div>
    </div>
    
    <!-- Loading Screen -->
    <div id="loading" class="loading-screen">
        <div class="spinner"></div>
        <p>Bienvenue chez Vert Resto...</p>
    </div>

    <script src="js/babylon-config.js"></script>
    <script src="js/materials-lib.js"></script>
    <script src="js/scene-builder.js"></script>
    <script src="js/furniture.js"></script>
    <script src="js/lighting.js"></script>
    <script src="js/interactions.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
